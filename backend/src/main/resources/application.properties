# Datasource Configuration (MySQL by default)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vesper_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.show-sql=true

# Server port (supports cloud platform port injection)
server.port=${PORT:8080}

# Security and JWT configurations
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# Assistant AI & Search Properties
ai.api.key=${AI_API_KEY:}
ai.model=${AI_MODEL:gemini-flash-lite-latest}
search.api.key=${SEARCH_API_KEY:}

# Enable H2 Console for testing/debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
allowed.origins=${ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:*}}
